services:
  backend:
    build:
      context: .
      dockerfile: dockerfile.backend
    container_name: vmsbot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.development
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: dockerfile.frontend
    container_name: vmsbot-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend